name: "Setup and install (pnpm)"
description: "setting up pnpm as runtime"

runs:
  using: composite
  steps:
    - name: setup pnpm
      uses: pnpm/action-setup@v4

    - name: setup node
      uses: actions/setup-node@v6
      with:
        node-version: 24
        cache: pnpm

    - shell: bash
      run: pnpm install
